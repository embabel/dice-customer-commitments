name: Verify
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - run: ./mvnw -B verify
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
        env:
          COMMITMENTS_ARTIFACTS: ${{ runner.temp }}/commitments-screens
      - run: bun run test:browser
        env:
          COMMITMENTS_BROWSER_MODE: live
          COMMITMENTS_ARTIFACTS: ${{ runner.temp }}/commitments-screens
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: commitments-screens
          path: ${{ runner.temp }}/commitments-screens/
